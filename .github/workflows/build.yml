name: Build Static Cloudflared 64K for OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Official Cloudflare Repo
        uses: actions/checkout@v4
        with:
          repository: cloudflare/cloudflared
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Pure Static Binary with 64KB Page Alignment
        run: |
          # 关闭 CGO，使用纯 Go 静态编译，杜绝任何外部 glibc 依赖
          # 通过 Go 内部链接器 -extldflags "-static" 强制全静态
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=arm64 \
          go build -v -trimpath \
            -ldflags="-s -w -extldflags '-static'" \
            -o cloudflared-linux-arm64-static \
            ./cmd/cloudflared

          # 验证生成的文件属性（必须显示 statically linked）
          file cloudflared-linux-arm64-static

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-arm64-static
          path: cloudflared-linux-arm64-static
